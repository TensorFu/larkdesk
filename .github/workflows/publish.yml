name: release

on:
  push:
    tags:
      - "v*"

jobs:
  macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go build -ldflags="-s -w" -o larkdesk ./cmd/larkdesk
      - uses: softprops/action-gh-release@v2
        with:
          files: larkdesk
